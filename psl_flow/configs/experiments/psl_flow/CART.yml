route: psl_flow
model:
  model_arch: psl_flow
  model_config:
    cfg_scale: 1.0
    thermal_normalizer:
    rgb_normalizer: 0.18215
    vae: ema
    rgb_vae_latent_channels: 4
    eval_lpips: true
    psl_vae_ckpt: ""
    rgb_vae_path: ""
    rgb_vae_repo: stabilityai/sd-vae-ft-ema
    rgb_vae_default_local_path: /root/autodl-fs/sd-vae-ft-ema
    rgb_vae_local_files_only: false
    teacher:
      ckpt: ""
      strict_load: false
      smp_model: Unet
      smp_encoder: resnet18
      smp_encoder_weights:
      vnums: 4
      erme_kernel: 5
      lambda_env_init: 0.1
    psl_vae_config:
      in_channels: 5
      out_channels: 5
      down_block_types: [DownEncoderBlock2D, DownEncoderBlock2D, DownEncoderBlock2D, DownEncoderBlock2D]
      up_block_types: [UpDecoderBlock2D, UpDecoderBlock2D, UpDecoderBlock2D, UpDecoderBlock2D]
      block_out_channels: [128, 256, 512, 512]
      layers_per_block: 2
      act_fn: silu
      latent_channels: 8
      norm_num_groups: 32
      sample_size: 256
      force_upcast: true
      use_quant_conv: true
      use_post_quant_conv: true
      mid_block_add_attention: true
      divisible: 8
      temperature_log_scale: 4.0
      env_log_scale: 4.0
      delta_clip: 0.25
      residual_gate_power: 1.0
      residual_blur_kernel: 9
      residual_blur_sigma: 2.0
      residual_use_highpass: false
    rgb_vae_config:
      in_channels: 3
      out_channels: 3
      down_block_types: [DownEncoderBlock2D, DownEncoderBlock2D, DownEncoderBlock2D, DownEncoderBlock2D]
      up_block_types: [UpDecoderBlock2D, UpDecoderBlock2D, UpDecoderBlock2D, UpDecoderBlock2D]
      block_out_channels: [128, 256, 512, 512]
      layers_per_block: 2
      act_fn: silu
      latent_channels: 4
      norm_num_groups: 32
      sample_size: 256
      force_upcast: true
      use_quant_conv: true
      use_post_quant_conv: true
      mid_block_add_attention: true
    sit_config:
      arch: L
      patch_size: 2
      num_classes: 1000
      injection_args:
        injection_method: concat
        replace_RGB: false
    transport_config:
      path_type: Linear
      prediction: velocity
      loss_weight:
    sample_ode:
      sampling_method: dopri5
      num_steps: 50
      atol: 1.0e-6
      rtol: 1.0e-3

datasets:
  datasets_folder: ./datasets_preprocess
  dataset_config_root: psl_flow/configs/experiments/datasets
  train_datasets: [CART]
  val_datasets: [CART]
  test_datasets: [CART]
  target_val_dataset: CART

training:
  num_epochs: 1000
  max_steps: -1
  num_samples_per_epoch: 10000
  train_batch_size: 16
  test_batch_size: 16
  num_workers: 8
  train_image_size: [256, 256]
  image_norm: normal
  optimizer:
    name: AdamW
    lr: 1.0e-4
    weight_decay: 0.0
  loss:
    name: psl_flow
    config:
  mixed_precision: false
  gradient_accumulation: 1
  gradient_clip_val: 1.0
  check_val_every_n_epoch: 0
  val_check_interval: 5000
  limit_val_batches:
  checkpoint_save_top_k: 1
  checkpoint_monitor: val/LPIPS
  checkpoint_mode: min
  disable_logger: false
  log_every_n_steps: 50
  seed: 1234
  cuda_tf32: true
  float32_matmul_precision: high
  export_samples: true
  num_sample_images: 4
  num_sample_batches: 1

