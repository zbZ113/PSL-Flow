model:
  model_arch: psl_vae
  model_config:
    in_channels: 5
    out_channels: 5
    down_block_types: [DownEncoderBlock2D, DownEncoderBlock2D, DownEncoderBlock2D, DownEncoderBlock2D]
    up_block_types: [UpDecoderBlock2D, UpDecoderBlock2D, UpDecoderBlock2D, UpDecoderBlock2D]
    block_out_channels: [128, 256, 512, 512]
    layers_per_block: 2
    act_fn: silu
    latent_channels: 8
    norm_num_groups: 32
    sample_size: 256
    force_upcast: true
    use_quant_conv: true
    use_post_quant_conv: true
    mid_block_add_attention: true
    divisible: 8
    temperature_log_scale: 4.0
    env_log_scale: 4.0
    delta_clip: 0.25
    residual_gate_power: 1.0
    residual_blur_kernel: 9
    residual_blur_sigma: 2.0
    residual_use_highpass: false

datasets:
  datasets_folder: ./datasets_preprocess
  dataset_config_root: psl_flow/configs/experiments/datasets
  train_datasets: [AVIID]
  val_datasets: [AVIID]
  test_datasets: [AVIID]
  target_val_dataset: AVIID

training:
  num_epochs: 300
  max_steps: -1
  num_samples_per_epoch: 2412
  train_batch_size: 16
  test_batch_size: 16
  num_workers: 8
  train_image_size: [256, 256]
  image_norm: normal
  optimizer:
    name: AdamW
    lr: 6.0e-5
    weight_decay: 1.0e-3
  loss:
    name: psl_vae
    config:
      teacher:
        ckpt: ""
        strict_load: false
        smp_model: Unet
        smp_encoder: resnet18
        smp_encoder_weights:
        vnums: 4
        erme_kernel: 5
        lambda_env_init: 0.1
      lambda_f: 1.0
      lambda_phys: 1.0
      lambda_perc: 0.5
      lambda_kl: 1.0e-6
  mixed_precision: false
  gradient_accumulation: 1
  gradient_clip_val: 1.0
  check_val_every_n_epoch: 50
  limit_val_batches:
  checkpoint_monitor: val/LPIPS
  checkpoint_mode: min
  checkpoint_save_top_k: 1
  checkpoint_every_n_epochs: 50
  disable_logger: false
  log_every_n_steps: 50
  seed: 1234
  cuda_tf32: true
  float32_matmul_precision: high
  export_samples: true
  num_sample_images: 4
  num_sample_batches: 1
